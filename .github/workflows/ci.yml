name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit and golden tests (live tests are manual only)
        run: python -m pytest -m "not live"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t talk-to-data:ci .
      - name: Smoke test the container (scripted backend, no secrets)
        run: |
          docker run -d --name t2d -e LLM_BACKEND=smoke -p 8000:8000 talk-to-data:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 2; done
          curl -fsS -X POST http://127.0.0.1:8000/api/ask -H 'Content-Type: application/json' \
            -d '{"question":"List all active funds with region, strategy and latest AUM.","user_id":"priya"}' | grep -q F001
          docker rm -f t2d
